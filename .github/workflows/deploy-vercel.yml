name: Deploy to Vercel

on:
  push:
    branches: [main, 'arena/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Baba Shree Industries
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    steps:
      - name: Check deployment configuration
        id: config
        shell: bash
        run: |
          if [[ -n "$VERCEL_TOKEN" && -n "$VERCEL_ORG_ID" && -n "$VERCEL_PROJECT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Explain skipped deployment
        if: steps.config.outputs.ready != 'true'
        run: echo "Deployment skipped. Configure VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID as GitHub Actions secrets, and configure the Vercel project's production environment variables."
      - name: Checkout
        if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@v4
      - name: Set up Node.js
        if: steps.config.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        if: steps.config.outputs.ready == 'true'
        run: npm ci
      - name: Typecheck
        if: steps.config.outputs.ready == 'true'
        run: npm run typecheck
      - name: Run unit tests
        if: steps.config.outputs.ready == 'true'
        run: npm test
      - name: Install Vercel CLI
        if: steps.config.outputs.ready == 'true'
        run: npm install --global vercel@latest
      - name: Pull Vercel project and environment
        if: steps.config.outputs.ready == 'true'
        run: vercel pull --yes --environment="$VERCEL_ENVIRONMENT" --token="$VERCEL_TOKEN"
      - name: Generate Prisma Client
        if: steps.config.outputs.ready == 'true'
        run: node scripts/run-with-env-file.cjs ".vercel/.env.${VERCEL_ENVIRONMENT}.local" npx prisma generate
      - name: Apply production migration and seed CMS content
        if: steps.config.outputs.ready == 'true' && github.ref == 'refs/heads/main'
        run: |
          ENV_FILE=".vercel/.env.${VERCEL_ENVIRONMENT}.local"
          node scripts/run-with-env-file.cjs "$ENV_FILE" npx prisma migrate deploy
          node scripts/run-with-env-file.cjs "$ENV_FILE" npm run db:seed
      - name: Build Vercel deployment
        if: steps.config.outputs.ready == 'true'
        run: |
          if [ "$VERCEL_ENVIRONMENT" = "production" ]; then
            vercel build --prod --token="$VERCEL_TOKEN"
          else
            vercel build --token="$VERCEL_TOKEN"
          fi
      - name: Publish deployment
        if: steps.config.outputs.ready == 'true'
        run: |
          if [ "$VERCEL_ENVIRONMENT" = "production" ]; then
            vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
          else
            vercel deploy --prebuilt --token="$VERCEL_TOKEN"
          fi
