name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    name: Install, test and build
    runs-on: ubuntu-latest
    env:
      # Build-only placeholders. They are never used for a database connection.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/babashree_ci
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/babashree_ci
      SESSION_SECRET: ci-only-not-a-production-secret-ci-only
      NEXT_PUBLIC_SITE_URL: https://example.invalid
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check dependency advisories
        run: npm audit --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
